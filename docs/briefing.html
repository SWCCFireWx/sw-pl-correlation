<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW fire danger &amp; PL briefing</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  .sheet { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px 26px; max-width: 1000px; margin: 16px auto; }
  .sheet h1 { font-size: 21px; } .sheet h3 { font-size: 14px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
  .tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .tile .big { font-size: 24px; font-weight: 650; line-height: 1.2; } .tile .lbl { font-size: 12px; color: var(--text-secondary); }
  .sheet table { font-size: 13px; } .sheet th, .sheet td { padding: 4px 6px; }
  .foot { font-size: 11px; color: var(--text-secondary); margin-top: 12px; }
  .controls-row { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
  @media print {
    @page { size: letter; margin: 0.4in; }
    nav.top, .controls-row, header.page { display: none !important; }
    body { background: #fff; color: #000; font-size: 11px; }
    .sheet { border: 0; padding: 0; margin: 0; max-width: none; }
    .sheet h1 { font-size: 15px; margin: 0; } .sheet h3 { font-size: 10px; margin: 7px 0 2px; }
    .tiles { gap: 6px; margin-top: 6px; } .tile { padding: 4px 7px; } .tile .big { font-size: 15px; } .tile .lbl { font-size: 9px; }
    .sheet table { font-size: 9.5px; } .sheet th, .sheet td { padding: 1.5px 5px; } .sheet th { font-size: 8.5px; }
    .sheet .note { font-size: 9px; } .foot { font-size: 8px; margin-top: 6px; line-height: 1.35; }
    .cls, .plb { padding: 0 4px; font-size: 9.5px; min-width: 26px; }
    .cls, .plb { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 800px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="page"><h1>One-page briefing</h1>
  <p class="sub">Pick a date, then print it, save it as a PDF, or download the numbers as a CSV.</p></header>
<div class="controls-row bar-controls">
  <label>Date <span class="datebox" id="dateBox"></span></label>
  <label>&nbsp;<button class="primary" onclick="window.print()">Print / Save as PDF</button></label>
  <label>&nbsp;<button id="csvBtn">Download CSV</button></label>
</div>
<div class="sheet" id="sheet"><p class="note">Loading…</p></div>
<script>
navBar();
let D, A, P, F, ARCH, BP, fireCache = {}, cur = {};
const idxOf = (arr, d) => arr.indexOf(d);
async function fires(y) { if (!(y in fireCache)) fireCache[y] = getJSON(`data/map/fires_${y}.json`).catch(() => []); return fireCache[y]; }
const val = (col, i) => (D[col] && i >= 0) ? D[col][i] : null;
const sumBack = (col, i, n) => { if (!D[col] || i < 0) return null; let s = 0, k = 0; for (let j = Math.max(0, i - n + 1); j <= i; j++) if (D[col][j] != null) { s += D[col][j]; k++; } return k ? s : null; };

async function render(date) {
  const i = idxOf(D.date, date), pi = idxOf(P.dates, date), y = +date.slice(0, 4);
  const fr = await fires(y);
  const lo = new Date(date + 'T12:00'); lo.setDate(lo.getDate() - 6); const loS = lo.toISOString().slice(0, 10);
  const fDay = {}, f7 = {};
  fr.forEach(r => { if (r[0] === date) fDay[r[5]] = (fDay[r[5]] || 0) + 1; if (r[0] >= loS && r[0] <= date) f7[r[5]] = (f7[r[5]] || 0) + 1; });
  // forecast for this date: latest if it's the base date, else the archive
  let fc = null;
  if (F && F.sw && F.sw.base_date === date) fc = { sw: F.sw, psa: F.psa, full: true };
  else if (ARCH && ARCH[date]) fc = ARCH[date];
  const fcDays = s => !s ? [] : s.full === undefined && Array.isArray(s.days) && Array.isArray(s.days[0]) ? s.days.map(d => ({ h: d[0], most_likely: d[1], p_up: d[2] })) : (s.days || []);
  const maxUp = s => { const ds = fcDays(s); return ds.length ? Math.max(...ds.map(d => d.p_up || 0)) : null; };
  const day7 = s => { const ds = fcDays(s); return ds.length ? ds[ds.length - 1].most_likely : null; };

  const pl = val('pl', i), nErc90 = val('psa_n_erc_90', i), ltg = val('lightning_strikes', i);
  const acres = val('imsr_sw_acres_growth', i), acres7 = sumBack('imsr_sw_acres_growth', i, 7);
  const starts = val('fire_new_starts', i), starts7 = sumBack('fire_new_starts', i, 7);
  const codes = Object.keys(P.psa).sort();
  const rows = codes.map(c => {
    const p = P.psa[c], g = k => (pi >= 0 && p[k]) ? p[k][pi] : null;
    const fs = fc ? (fc.psa || {})[c] : null;
    return { psa: c, erc: g('erc_avg'), erc_class: g('erc_class'), bi: g('bi_avg'), bi_class: g('bi_class'),
             starts: fDay[c] || 0, starts7: f7[c] || 0, lightning: g('lightning'), pl_day7: day7(fs), p_up: maxUp(fs) };
  });
  cur = { date, pl, rows, sw: { pl, nErc90, starts, starts7, acres, acres7, ltg } };

  const top = (A.ranking.season || []).filter(e => e.best_r != null && !e.var.includes('__')).slice(0, 5);
  const swFc = fc ? fcDays(fc.sw) : [];
  document.getElementById('sheet').innerHTML = `
    <h1>Southwest fire danger &amp; PL briefing · ${new Date(date + 'T12:00').toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</h1>
    <div class="tiles">
      <div class="tile"><div class="lbl">Southwest PL</div><div class="big">${pl == null ? '–' : 'PL ' + pl}</div></div>
      <div class="tile"><div class="lbl">PSAs at/above 90th ERC(Y)</div><div class="big">${fmt(nErc90)} <span class="note">of ${codes.length}</span></div></div>
      <div class="tile"><div class="lbl">New fire starts (day · 7 days)</div><div class="big">${fmt(starts)} · ${fmt(starts7)}</div></div>
      <div class="tile"><div class="lbl">Acres burned, all SW fires (day · 7 days)</div><div class="big">${fmt(acres)} · ${fmt(acres7)}</div></div>
      <div class="tile"><div class="lbl">Lightning strikes</div><div class="big">${ltg == null ? '<span class="note" style="font-size:14px">not posted yet</span>' : fmt(ltg)}</div></div>
    </div>
    <h3>7-day Southwest PL outlook ${fc ? '' : '<span class="note">(no forecast was issued for this date)</span>'}</h3>
    ${swFc.length ? `<table><tr>${swFc.map(d => `<th class="c">+${d.h}d</th>`).join('')}</tr><tr>${swFc.map(d => `<td class="c">${plBadge(d.most_likely)}<br><span class="note">↑ ${Math.round((d.p_up || 0) * 100)}%</span></td>`).join('')}</tr></table>
      <p class="note" style="margin:2px 0">Most likely PL each day; ↑ = chance the PL will be higher than today's. From observed FEMS data and the archive only.</p>` : ''}
    <h3>By PSA</h3>
    <table><tr><th>PSA</th><th class="num">ERC(Y) avg</th><th>ERC(Y) class</th><th class="num">BI avg</th><th>BI class</th>
      <th class="num">Starts (day)</th><th class="num">Starts (7 d)</th><th class="num">Lightning</th><th class="c">PSA outlook, day 7</th><th class="num">Max ↑ chance</th></tr>
      ${rows.map(r => `<tr><td><b>${r.psa}</b></td><td class="num">${fmt(r.erc, 1)}</td><td>${clsBadge(r.erc_class)}</td><td class="num">${fmt(r.bi, 1)}</td><td>${clsBadge(r.bi_class)}</td>
        <td class="num">${r.starts}</td><td class="num">${r.starts7}</td><td class="num">${r.lightning == null ? '–' : fmt(r.lightning)}</td>
        <td class="c">${plBadge(r.pl_day7)}</td><td class="num">${r.p_up == null ? '–' : Math.round(r.p_up * 100) + '%'}</td></tr>`).join('')}
    </table>
    <h3>Values that track the SW PL most closely (Mar–Oct)</h3>
    <table><tr><th>Value</th><th class="num">This day</th><th class="num">Match with PL</th><th class="num">Best lead</th></tr>
      ${top.map(e => `<tr><td>${(A.labels[e.var] || e.var).replace(/ \[.*\]/, '')}</td><td class="num">${fmt(val(e.var, i), 1)}</td><td class="num">${Math.round(Math.abs(e.best_r) * 100)}%</td><td class="num">${e.best_lag ? e.best_lag + ' days' : 'same day'}</td></tr>`).join('')}
    </table>
    <p class="foot">ERC(Y)/BI: key-station PSA averages, using the method and breakpoints in the breakpoints workbook (${BP ? BP.erc_label : ''}); class is the highest percentile reached (&lt;50, 50th, 75th, 85th (ERC), 90th, 97th).
      Fire starts: WFIGS/IRWIN, by discovery date. Acres burned: change in Southwest year-to-date acres in NICC's IMSR (weekly reports are spread over the week).
      Lightning: NOAA NCEI NLDN daily tiles (posted monthly). PSA outlook: chance of each Southwest PL, from that PSA's data alone.
      Generated ${new Date().toLocaleString()}.</p>`;
}

document.getElementById('csvBtn').onclick = () => {
  const r = cur.rows || []; const s = cur.sw || {};
  let t = `Southwest briefing,${cur.date}\nSouthwest PL,${s.pl ?? ''}\nPSAs >= 90th ERC(Y),${s.nErc90 ?? ''}\nNew fire starts (day),${s.starts ?? ''}\nNew fire starts (7 days),${s.starts7 ?? ''}\nAcres burned (day),${s.acres ?? ''}\nAcres burned (7 days),${s.acres7 ?? ''}\nLightning strikes,${s.ltg ?? ''}\n\n`;
  t += 'PSA,ERCy avg,ERCy class,BI avg,BI class,Starts day,Starts 7d,Lightning,PSA outlook day 7 PL,Max chance PL higher\n';
  t += r.map(x => [x.psa, x.erc, x.erc_class, x.bi, x.bi_class, x.starts, x.starts7, x.lightning, x.pl_day7, x.p_up].map(v => v ?? '').join(',')).join('\n');
  download(`sw_briefing_${cur.date}.csv`, t);
};

(async () => {
  try {
    [D, A, P] = await Promise.all([getJSON('data/daily.json'), getJSON('data/analysis.json'), getJSON('data/map/psa_daily.json')]);
  } catch (e) { document.getElementById('sheet').innerHTML = '<p class="note">Not ready yet. The briefing appears after the first data runs.</p>'; return; }
  [F, ARCH, BP] = await Promise.all([getJSON('data/forecast.json').catch(() => null), getJSON('data/forecast_archive.json').catch(() => null), getJSON('data/breakpoints.json').catch(() => null)]);
  const min = D.date[0], max = D.date[D.date.length - 1];
  const q = new URLSearchParams(location.search).get('date');
  const start = q && q >= min && q <= max ? q : max;
  dateBox(document.getElementById('dateBox'), min, max, start, d => { history.replaceState(null, '', '?date=' + d); render(d); });
  render(start);
})();
</script>
</body>
</html>
